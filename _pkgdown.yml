url: https://hassanpazira.github.io/BFI/

template:
  bootstrap: 5
  bootswatch: flatly # spacelab
  params:
    mathjax: true

development:
  mode: auto
  version_label: default

reference:
- title: Main functions
  contents:
  - MAP.estimation
  - bfi
  - inv.prior.cov
  - summary.bfi
  - hazards.fun
  - coef.bfi

- title: Supporting functions
  contents:
  - surv.simulate
  - b.diag
  - n.par

- title: Data sets
  contents:
  - Nurses
  - trauma

- title: Package
  contents:
  - BFI-package

navbar:
  type: default
  left:
  - text: Reference
    href: reference/index.html
  - text: Articles
    href: articles/index.html
    desc: "Several articles/vignettes that describe the usage of BFI"
    menu:
    - text: An Introduction to BFI
      href: articles/BFI.html
    - text: Calling BFI from Python
      href: articles/Python.html
    - text: Using BFI in SAS
      href: articles/SAS.html
  - text: News
    href: news/index.html
  right:
  - icon: fa-github fa-lg
    aria-label: GitHub
    href: https://github.com/hassanpazira/BFI
